# Graves para el teclado reactivo (lo lee ~/.local/bin/kbd-music)
[general]
bars = 2
framerate = 20
lower_cutoff_freq = 40
higher_cutoff_freq = 250
sleep_timer = 2

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
