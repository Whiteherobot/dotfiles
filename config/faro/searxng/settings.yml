# SearXNG local para Faro: solo 127.0.0.1, sin limitador, con salida JSON para Open WebUI.
use_default_settings: true
general:
  instance_name: "Faro búsqueda"
search:
  safe_search: 0
  default_lang: "es"
  formats:
    - html
    - json
server:
  secret_key: "se-genera-al-instalar"
  limiter: false
  image_proxy: false
  public_instance: false
